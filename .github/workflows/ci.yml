name: ci

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build

      # Renders each unit topic page to site/pdf/ for the "Download PDF" button.
      # If this step fails the site still deploys; the button then falls back
      # to the browser's print dialog.
      - name: Generate topic PDFs
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python utils/build_pdfs.py --site site

      - name: Upload built site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
