site_name: DSO303
site_url: https://norbutlepcha25.github.io/dso303

use_directory_urls: false

# CHANGED: uncomment once every file listed in `nav` exists. Strict mode turns
# "file referenced in nav but not found" into a build failure instead of a
# warning you scroll past. Verified: the config below passes --strict today.
# strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    # REMOVED: toc.integrate
    #   It merges the page TOC into the LEFT sidebar and removes the right-hand
    #   one. Measured on the Lab 01 page: 139 in-page anchors were crammed into
    #   the left nav alongside the site navigation, and the right column was
    #   empty. Without it the TOC moves to the right column where it belongs.
    #   Put it back if you prefer the old layout — nothing else depends on it.
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - content.footnote.tooltips
    # OPTIONAL: adds an "Edit this page" pencil. Needs repo_url + edit_uri below.
    # - content.action.edit

  language: en
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      accent: blue
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Source Code Pro
  icon:
    logo: material/code-json

# OPTIONAL: lets students open an issue or a PR against a lab page directly.
# repo_url: https://github.com/norbutlepcha25/dso303
# repo_name: norbutlepcha25/dso303
# edit_uri: edit/main/docs/

extra_css:
  - stylesheets/color.css
  - https://unpkg.com/katex@0/dist/katex.min.css

copyright: |
  &copy; 2026 <a href="https://github.com/cslivenote" target="_blank" rel="noopener">Norbu Tshering Lepcha</a>

extra:
  generator: false
  # NOTE: harmless, but redundant — site_url already supplies the /dso303 path,
  # and MkDocs computes base_url per page. The macros plugin also exposes this
  # as a page variable literally named `base_url`, so `{{ base_url }}` in a page
  # resolves to "/dso303" rather than MkDocs' own relative value. Keep it only
  # if a page actually uses it.
  base_url: /dso303

markdown_extensions:
  # ADDED: MkDocs enables `toc` implicitly, but with no options. Configuring it
  # gives every heading a ¶ anchor (140 of them on the Lab 01 page), so you can
  # link a student straight to "Step 14" instead of "scroll down a bit".
  # toc_depth 2-3 keeps the right-hand TOC to sections and steps, not sub-steps.
  - toc:
      permalink: true
      toc_depth: "2-3"
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          # Material's docs show a `format:` key here. I tested with and without
          # it on your exact versions: the generated HTML is byte-identical
          # (<pre class="mermaid"><code>) and Material loads mermaid lazily from
          # its own bundle either way. Left as you had it — no change needed.
  - admonition
  - pymdownx.details
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

plugins:
  - search
  - glightbox
  # The macros plugin reads {{ ... }} in every page as Jinja2. That is what
  # broke Lab 01: `docker inspect --format '{{ index .Config.Labels "..." }}'`
  # is a Go template, not a macro. Two ways to protect a page — pick ONE:
  #   1. wrap the affected code blocks in {% raw %} / {% endraw %}   (used in Lab 01)
  #   2. put `render_macros: false` in the page's YAML front matter
  # Both verified working on mkdocs-macros 1.5.0. Do not use both on one page:
  # with macros disabled, the {% raw %} tags stop being stripped and show up
  # literally in the rendered output.
  - macros:
      module_name: main
      include_dir: macros
      include_yaml:
        - macros/vars.yml
        - macros/glossary.yml
        - macros/learning_outcomes.yml

  # KEEP, but pin it. mkdocs-minify-plugin pulls in jsmin and csscompressor,
  # which are unmaintained source-only packages. Both failed to build from a
  # clean install on Python 3.11 while I was testing this config. Your site
  # builds today because your runner has working wheels cached; a CI image
  # update can break it with no change from you. Freeze the whole toolchain in
  # requirements.txt and install with `pip install -r requirements.txt`:
  #     mkdocs-material==9.7.6
  #     mkdocs-macros-plugin==1.5.0
  #     mkdocs-glightbox==0.5.2
  #     mkdocs-minify-plugin==0.8.0
  #     pymdown-extensions==10.21.2
  - minify:
      minify_html: true

